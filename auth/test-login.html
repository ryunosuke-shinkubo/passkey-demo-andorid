<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Passkey redirect test</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 32px 20px;
        color: #111827;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
      }

      code,
      pre {
        word-break: break-all;
        white-space: pre-wrap;
      }

      button {
        border: 0;
        border-radius: 10px;
        background: #111827;
        color: #fff;
        padding: 12px 16px;
        font: inherit;
        cursor: pointer;
      }

      .panel {
        margin-top: 24px;
        padding: 16px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>テストログインページ</h1>
      <p>
        <code>redirect_url</code> と <code>state</code> を使ってコールバックへ戻すテスト用ページです。
      </p>

      <div class="panel">
        <div><strong>state</strong></div>
        <code id="stateValue"></code>
      </div>

      <div class="panel">
        <div><strong>redirect_url</strong></div>
        <code id="redirectValue"></code>
      </div>

      <form id="redirectForm" method="get">
        <input id="shortTimeCodeInput" type="hidden" name="shortTimeCode" value="TEST_SHORT_CODE">
        <input id="stateInput" type="hidden" name="state" value="">
        <p>
          <button type="submit">テスト用コールバックを開く</button>
        </p>
      </form>

      <p id="status"></p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const state = params.get("state") ?? "";
      const redirectUrl = params.get("redirect_url") ?? "";
      const status = document.getElementById("status");
      const stateValue = document.getElementById("stateValue");
      const redirectValue = document.getElementById("redirectValue");
      const redirectForm = document.getElementById("redirectForm");
      const stateInput = document.getElementById("stateInput");

      stateValue.textContent = state || "(empty)";
      redirectValue.textContent = redirectUrl || "(empty)";
      stateInput.value = state;

      if (!redirectUrl) {
        status.textContent = "redirect_url がないためテストできません。";
        redirectForm.hidden = true;
      } else {
        redirectForm.action = redirectUrl;
      }
    </script>
  </body>
</html>
