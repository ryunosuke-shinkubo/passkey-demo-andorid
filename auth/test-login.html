<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Passkey redirect test</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 32px 20px;
        color: #111827;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
      }

      code,
      pre {
        word-break: break-all;
        white-space: pre-wrap;
      }

      button {
        border: 0;
        border-radius: 10px;
        background: #111827;
        color: #fff;
        padding: 12px 16px;
        font: inherit;
        cursor: pointer;
      }

      .panel {
        margin-top: 24px;
        padding: 16px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>テストログインページ</h1>
      <p>
      まず defaultLoginPageUrl に飛び、ここで受け取った redirect_url をスマホに表示して、その URL に遷移します。
      </p>

      <div class="panel">
      <div><strong>redirect_url</strong></div>
      <code id="redirectUrlValue"></code>
      </div>

      <div class="panel">
      <div><strong>state</strong></div>
      <code id="stateValue"></code>
      </div>

    <form id="redirectForm">
      <p>
        <button type="submit">default URL を開く</button>
      </p>
    </form>

      <p id="status"></p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const state = params.get("state") ?? "";
      const redirectUrl = params.get("redirect_url") ?? "";
      const status = document.getElementById("status");
      const redirectUrlValue = document.getElementById("redirectUrlValue");
      const stateValue = document.getElementById("stateValue");
      const redirectForm = document.getElementById("redirectForm");

      redirectUrlValue.textContent = redirectUrl || "(empty)";
      stateValue.textContent = state || "(empty)";
      status.textContent = redirectUrl
        ? "ボタンを押すと redirect_url に移動します。"
        : "redirect_url がないため移動できません。";

      redirectForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!redirectUrl) return;
        window.location.assign(redirectUrl);
      });
    </script>
  </body>
</html>
